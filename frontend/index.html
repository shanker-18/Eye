<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tagging Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #f6f8ef;
      --panel: #ffffff;
      --panel-soft: #f1f3e9;
      --ink: #1b1f1e;
      --muted: #5a6360;
      --line: #d4dacb;
      --accent: #0f766e;
      --accent-2: #c2410c;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 400px at 10% -10%, rgba(15,118,110,0.15), transparent 70%),
        radial-gradient(800px 300px at 90% 10%, rgba(194,65,12,0.14), transparent 65%),
        var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 14px 18px;
      background: rgba(255,255,255,0.8);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 5;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.03em;
      font-size: 1.05rem;
      margin-right: auto;
    }

    .small {
      color: var(--muted);
      font-size: 0.84rem;
      font-family: 'IBM Plex Mono', monospace;
    }

    .shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .left {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-header {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, var(--panel-soft));
    }

    .tree {
      overflow: auto;
      padding: 8px;
      min-height: 0;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 140ms ease, transform 120ms ease;
      user-select: none;
    }

    .tree-row:hover {
      background: #edf4f3;
      transform: translateX(1px);
    }

    .tree-row.active {
      background: #d9f0ed;
      outline: 1px solid #95d2cb;
    }

    .caret {
      width: 16px;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .tag-pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.11);
      background: #f7f8f5;
    }

    .tree-text {
      font-size: 0.86rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .right {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pages {
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 18px;
      min-height: 0;
    }

    .page-wrap {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fefefe;
      padding: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #ecefe2;
    }

    .page-img {
      display: block;
      width: 100%;
      height: auto;
    }

    .overlay-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .upload {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
    }

    .pager input {
      width: 74px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      background: #fff;
    }

    input[type="file"] {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
    }

    button {
      border: none;
      background: linear-gradient(90deg, var(--accent), #0ea5a4);
      color: white;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }
      .left {
        max-height: 36vh;
      }
      .right {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function clip(text, max = 64) {
      const cleaned = (text || "").replace(/\s+/g, " ").trim();
      if (!cleaned) return "";
      return cleaned.length > max ? cleaned.slice(0, max) + "..." : cleaned;
    }

    function scaleBBox(bbox, pageSize, displaySize) {
      const width = pageSize?.width || 1;
      const height = pageSize?.height || 1;
      let [x0, y0, x1, y1] = bbox.map((v) => Number(v));

      // Handle normalized [0..1000] fallback if present.
      if (x1 > width + 1 || y1 > height + 1) {
        x0 = x0 * width / 1000;
        x1 = x1 * width / 1000;
        y0 = y0 * height / 1000;
        y1 = y1 * height / 1000;
      }

      const sx = (displaySize?.width || 1) / width;
      const sy = (displaySize?.height || 1) / height;
      return {
        x: x0 * sx,
        y: y0 * sy,
        w: Math.max(1, (x1 - x0) * sx),
        h: Math.max(1, (y1 - y0) * sy),
      };
    }

    function resolveNavigableNode(node) {
      if (!node) return null;
      if (node.id !== "document" && node.page && Array.isArray(node.bbox)) {
        return node;
      }
      if (!Array.isArray(node.children)) return null;
      for (const child of node.children) {
        const resolved = resolveNavigableNode(child);
        if (resolved) return resolved;
      }
      return null;
    }

    function TreeNode({ node, level, expanded, onToggle, onSelect, selectedId }) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isOpen = expanded.has(node.id);
      const active = selectedId === node.id;

      return (
        <div>
          <div
            className={"tree-row" + (active ? " active" : "")}
            style={{ paddingLeft: 8 + level * 14 }}
            onClick={() => onSelect(node)}
          >
            <div className="caret" onClick={(e) => { e.stopPropagation(); if (hasChildren) onToggle(node.id); }}>
              {hasChildren ? (isOpen ? "-" : "+") : ""}
            </div>
            <span className="tag-pill">{node.tag}</span>
            <span className="tree-text">{clip(node.text)}</span>
          </div>

          {hasChildren && isOpen && node.children.map((child) => (
            <TreeNode
              key={child.id}
              node={child}
              level={level + 1}
              expanded={expanded}
              onToggle={onToggle}
              onSelect={onSelect}
              selectedId={selectedId}
            />
          ))}
        </div>
      );
    }

    function App() {
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [data, setData] = useState(null);
      const [meta, setMeta] = useState({ tagColors: {} });
      const [tags, setTags] = useState([]);
      const [expanded, setExpanded] = useState(new Set(["document"]));
      const [selectedNode, setSelectedNode] = useState(null);
      const [selectedBlock, setSelectedBlock] = useState(null);
      const [imgSizes, setImgSizes] = useState({});
      const [pageJump, setPageJump] = useState(1);
      const pageRefs = useRef({});
      const imgRefs = useRef({});
      const canvasRefs = useRef({});
      const pagesRef = useRef(null);

      useEffect(() => {
        fetch("/api/meta")
          .then((r) => r.json())
          .then(setMeta)
          .catch(() => {});
      }, []);

      const onUpload = async () => {
        if (!file) return;
        setLoading(true);
        setSelectedNode(null);
        setSelectedBlock(null);
        try {
          const form = new FormData();
          form.append("file", file);
          const res = await fetch("/api/tag-pdf", { method: "POST", body: form });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || "Upload failed");

          setData(body);
          const tree = body.tag_tree || null;
          setTags(tree ? [tree] : []);
          setExpanded(new Set(["document", ...(tree?.children || []).map((n) => n.id)]));
          setSelectedNode(tree || null);
        } catch (err) {
          alert(err.message || "Failed to tag PDF");
        } finally {
          setLoading(false);
        }
      };

      const toggle = (id) => {
        const next = new Set(expanded);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        setExpanded(next);
      };

      const handleImgLoad = (page, event) => {
        const img = event.currentTarget;
        setImgSizes((prev) => ({
          ...prev,
          [page]: {
            width: img.clientWidth,
            height: img.clientHeight,
          }
        }));
      };

      const jumpToPage = () => {
        const page = Math.max(1, Math.min(Number(pageJump || 1), data?.page_count || 1));
        const target = pageRefs.current[page];
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      };

      const onDownload = () => {
        if (!data?.filename) return;
        window.open(`/download-pdf/${encodeURIComponent(data.filename)}`, "_blank");
      };

      useEffect(() => {
        if (!data?.pages) return;
        const dpr = window.devicePixelRatio || 1;

        data.pages.forEach((pageObj) => {
          const page = pageObj.page;
          const canvas = canvasRefs.current[page];
          const img = imgRefs.current[page];
          if (!canvas || !img) return;

          const drawW = img.clientWidth || 1;
          const drawH = img.clientHeight || 1;
          if (drawW <= 1 || drawH <= 1) return;

          canvas.width = Math.round(drawW * dpr);
          canvas.height = Math.round(drawH * dpr);
          canvas.style.width = `${drawW}px`;
          canvas.style.height = `${drawH}px`;

          const ctx = canvas.getContext("2d");
          if (!ctx) return;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, drawW, drawH);

          const pageSize = data.page_sizes[String(page)] || data.page_sizes[page] || { width: 1, height: 1 };

          if (!selectedBlock || selectedBlock.id === "document" || selectedBlock.page !== page) return;

          const { x, y, w, h } = scaleBBox(selectedBlock.bbox || [0, 0, 1, 1], pageSize, { width: drawW, height: drawH });
          const color = meta.tagColors[selectedBlock.tag] || "rgba(15,118,110,0.33)";
          ctx.fillStyle = color;
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.lineWidth = 1;
          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        });
      }, [data, imgSizes, selectedBlock, meta]);

      useEffect(() => {
        if (!selectedBlock || !data?.page_count) return;

        const page = Number(selectedBlock.page || 0);
        const pageWrap = pageRefs.current[page];
        const pagesEl = pagesRef.current;
        if (!pageWrap || !pagesEl) return;

        pageWrap.scrollIntoView({ behavior: "smooth", block: "center" });

        const img = imgRefs.current[page];
        const pageSize = data.page_sizes[String(page)] || data.page_sizes[page] || { width: 1, height: 1 };
        if (!img || !Array.isArray(selectedBlock.bbox) || !img.clientWidth || !img.clientHeight) return;

        const { y, h } = scaleBBox(selectedBlock.bbox, pageSize, {
          width: img.clientWidth,
          height: img.clientHeight,
        });
        const pageRect = pageWrap.getBoundingClientRect();
        const pagesRect = pagesEl.getBoundingClientRect();
        const pageTopWithinScroller = (pageRect.top - pagesRect.top) + pagesEl.scrollTop;
        const targetTop = pageTopWithinScroller + y + (h / 2) - (pagesEl.clientHeight / 2);
        pagesEl.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }, [selectedBlock, imgSizes, data]);

      const handleSelectNode = (node) => {
        setSelectedNode(node);
        const target = resolveNavigableNode(node);
        setSelectedBlock(target);
        if (target?.page) {
          setPageJump(target.page);
        }
      };

      return (
        <>
          <div className="topbar">
            <div className="brand">PDF Tagging Engine</div>
            <div className="upload">
              <input type="file" accept="application/pdf" onChange={(e) => setFile(e.target.files?.[0] || null)} />
              <button disabled={!file || loading} onClick={onUpload}>{loading ? "Tagging..." : "Tag PDF"}</button>
              <button disabled={!data?.filename} onClick={onDownload}>Download Tagged PDF</button>
            </div>
            {data && (
              <div className="pager">
                <span>Page</span>
                <input
                  type="number"
                  min="1"
                  max={data.page_count}
                  value={pageJump}
                  onChange={(e) => setPageJump(e.target.value)}
                />
                <button onClick={jumpToPage}>Go</button>
              </div>
            )}
            <div className="small">{data ? `${data.page_count} pages` : "Upload a PDF to begin"}</div>
          </div>

          <div className="shell">
            <div className="panel left">
              <div className="left-header">
                <strong>Tag Tree</strong>
              </div>
              <div className="tree">
                {tags.length > 0 ? (
                  <TreeNode
                    node={tags[0]}
                    level={0}
                    expanded={expanded}
                    onToggle={toggle}
                    onSelect={handleSelectNode}
                    selectedId={selectedNode?.id}
                  />
                ) : (
                  <div className="empty">No Tags available</div>
                )}
              </div>
            </div>

            <div className="panel right">
              <div className="pages" ref={pagesRef}>
                {!data && <div className="empty">PDF pages will be rendered here without visible labels.</div>}
                {data?.pages?.map((pageObj) => {
                  const page = pageObj.page;
                  const src = `/api/page-image/${data.doc_id}/${page}`;

                  return (
                    <div className="page-wrap" key={page} ref={(el) => { pageRefs.current[page] = el; }}>
                      <div className="canvas-wrap">
                        <img
                          className="page-img"
                          src={src}
                          loading="lazy"
                          onLoad={(e) => handleImgLoad(page, e)}
                          ref={(el) => { imgRefs.current[page] = el; }}
                          alt={`Page ${page}`}
                        />
                        <canvas className="overlay-canvas" ref={(el) => { canvasRefs.current[page] = el; }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
